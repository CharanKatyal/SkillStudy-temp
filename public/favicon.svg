<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="skudiumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#0b1120" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#skudiumGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Orbital Ring -->
  <ellipse cx="32" cy="32" rx="20" ry="8" stroke="url(#coreGlow)" stroke-width="2" stroke-dasharray="3 3" opacity="0.7" transform="rotate(-30 32 32)" />
  
  <!-- Stylized Geometric "S" Emblem -->
  <path d="M41 22C41 18.5 37.5 16 32 16C25.5 16 22 19 22 23C22 28.5 30 29.5 31.5 31C33.5 33 33.5 35 31.5 36.5C29 38 24 38 22 35.5M23 42C23 45.5 26.5 48 32 48C38.5 48 42 45 42 41C42 35.5 34 34.5 32.5 33C30.5 31 30.5 29 32.5 27.5C35 26 40 26 42 28.5" 
        stroke="url(#skudiumGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Core Knowledge Spark -->
  <circle cx="32" cy="32" r="3.5" fill="#f8fafc" filter="url(#glow)" />
</svg>
